<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F0E8;
    --warm-white: #FAF8F4;
    --ink: #1A1714;
    --ink-soft: #4A4540;
    --ink-muted: #8C8580;
    --gold: #C4933A;
    --gold-light: #E8C97A;
    --gold-pale: #F7EDD6;
    --rust: #B85C38;
    --border: rgba(26,23,20,0.12);
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background-color: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 180px 180px;
    pointer-events: none;
    z-index: 0;
  }

  /* Decorative background lines */
  .bg-lines {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .bg-lines::before {
    content: '';
    position: absolute;
    top: -20%;
    right: -10%;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    border: 1px solid var(--border);
    opacity: 0.6;
  }

  .bg-lines::after {
    content: '';
    position: absolute;
    top: -5%;
    right: 5%;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    border: 1px solid var(--border);
    opacity: 0.4;
  }

  .bg-arc {
    position: fixed;
    bottom: -15%;
    left: -8%;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 1px solid var(--border);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  /* Page layout */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    padding: 2rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-img {
    height: 36px;
    width: auto;
    object-fit: contain;
  }

  .logo-text {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--gold-pale);
    border: 1px solid rgba(196,147,58,0.3);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Main content */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
  }

  .content {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }

  /* Large decorative glyph */
  .glyph {
    margin: 0 auto 3rem;
    width: 96px;
    height: 96px;
    position: relative;
    animation: float 5s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  .glyph svg {
    width: 100%;
    height: 100%;
  }

  /* Eyebrow */
  .eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.25rem;
  }

  /* Headline */
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  /* Subtitle */
  .subtitle {
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto 3.5rem;
    font-weight: 300;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 0 auto 3rem;
    max-width: 320px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Call card */
  .call-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    max-width: 400px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
  }

  .call-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.7;
  }

  .call-card:hover {
    border-color: rgba(196,147,58,0.3);
    transform: translateY(-2px);
  }

  .call-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 1rem;
  }

  .call-number {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--ink);
    letter-spacing: -0.01em;
    margin-bottom: 1.25rem;
    display: block;
  }

  .call-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: var(--warm-white);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 12px 28px;
    border-radius: 100px;
    transition: background 0.2s, transform 0.2s;
  }

  .call-button:hover {
    background: var(--gold);
    color: var(--ink);
    transform: scale(1.02);
  }

  .call-button svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* Footer */
  footer {
    padding: 1.5rem 3rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .footer-text {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.03em;
  }

  /* Entrance animations */
  .glyph { animation: float 5s ease-in-out infinite, fadeUp 0.8s ease both; }
  .eyebrow { animation: fadeUp 0.8s ease 0.1s both; }
  h1 { animation: fadeUp 0.8s ease 0.2s both; }
  .subtitle { animation: fadeUp 0.8s ease 0.3s both; }
  .divider { animation: fadeUp 0.8s ease 0.4s both; }
  .call-card { animation: fadeUp 0.8s ease 0.5s both; }
  footer { animation: fadeUp 0.8s ease 0.6s both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    header { padding: 1.25rem 1.5rem; }
    footer { padding: 1.25rem 1.5rem; }
    .logo-text { display: none; }
    h1 { font-size: 2.6rem; }
    .call-number { font-size: 1.75rem; }
  }
</style>
</head>
<body>

<div class="bg-lines"></div>
<div class="bg-arc"></div>

<div class="page">

  <header>
    <div class="logo-mark">
      <img src="/images/logo.png" alt="Karthik Traders Logo" class="logo-img" />
      <span class="logo-text">Karthik Traders</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Maintenance Mode
    </div>
  </header>

  <main>
    <div class="content">

      <div class="glyph">
        <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer ring -->
          <circle cx="48" cy="48" r="44" stroke="#C4933A" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
          <!-- Middle ring -->
          <circle cx="48" cy="48" r="32" stroke="#C4933A" stroke-width="1" opacity="0.3"/>
          <!-- Gear teeth approximation - inner gear shape -->
          <path d="M48 18 L51 24 L57 20 L57 27 L63 26 L61 32 L67 34 L63 39 L68 43 L63 46 L66 52 L60 53 L60 59 L54 58 L51 64 L48 60 L45 64 L42 58 L36 59 L36 53 L30 52 L33 46 L28 43 L33 39 L29 34 L35 32 L33 26 L39 27 L39 20 L45 24 Z" stroke="#C4933A" stroke-width="1.5" fill="rgba(196,147,58,0.08)" stroke-linejoin="round"/>
          <!-- Center circle -->
          <circle cx="48" cy="48" r="10" stroke="#C4933A" stroke-width="1.5" fill="rgba(196,147,58,0.15)"/>
          <!-- Center dot -->
          <circle cx="48" cy="48" r="3" fill="#C4933A"/>
          <!-- Cross hairs subtle -->
          <line x1="48" y1="38" x2="48" y2="42" stroke="#C4933A" stroke-width="1" opacity="0.6"/>
          <line x1="48" y1="54" x2="48" y2="58" stroke="#C4933A" stroke-width="1" opacity="0.6"/>
          <line x1="38" y1="48" x2="42" y2="48" stroke="#C4933A" stroke-width="1" opacity="0.6"/>
          <line x1="54" y1="48" x2="58" y2="48" stroke="#C4933A" stroke-width="1" opacity="0.6"/>
        </svg>
      </div>

      <p class="eyebrow">Scheduled Maintenance</p>

      <h1>We'll be back <em>shortly</em></h1>

      <p class="subtitle">
        Our website is currently undergoing planned maintenance to bring you a better experience. We appreciate your patience.
      </p>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-diamond"></div>
        <div class="divider-line"></div>
      </div>

      <div class="call-card">
        <p class="call-label">Need assistance? Reach us at</p>
        <span class="call-number">+91 99638 40058</span>
        <a href="tel:+919963840058" class="call-button">
          <svg viewBox="0 0 16 16">
            <path d="M5.5 2.5C5.5 2.5 4 2 3 3S2 6 4 8s4 4 6 3 1.5-2.5 1.5-2.5l-2-1.5-1 .5-1.5-1.5.5-1L5.5 2.5Z"/>
          </svg>
          Call Us Now
        </a>
      </div>

    </div>
  </main>

  <footer>
    <span class="footer-text">© 2025 · All rights reserved · Back soon</span>
  </footer>

</div>

</body>
</html>
