<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerator Live View</title>
<style>
  html, body { margin: 0; background: #eef5f9; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  /* 16:9 on landscape screens, 9:16 on portrait; ?ratio=16:9 or ?ratio=9:16 forces one */
  #stage { position: relative; width: min(100%, calc(90vh * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 24px;
           overflow: hidden; background: #87ceeb; box-shadow: 0 18px 50px rgba(15, 60, 90, .25); }
  @media (orientation: portrait) { #stage:not([data-ratio]) { width: min(100%, calc(90vh * 9 / 16)); aspect-ratio: 9 / 16; } }
  #stage[data-ratio="9:16"] { width: min(100%, calc(90vh * 9 / 16)); aspect-ratio: 9 / 16; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px;
         background: rgba(255, 255, 255, .85); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
         color: #0f2a3a; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); white-space: nowrap; }
  #do { top: 14px; left: 14px; }
  #do i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #16a34a); transition: background .4s; }
  #toggle { bottom: 14px; left: 50%; transform: translateX(-50%); border: 0; cursor: pointer; font: inherit; font-weight: 600; }
  .track { width: 46px; height: 26px; border-radius: 13px; background: #94a3b8; position: relative; transition: background .25s; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .25s; }
  #toggle[aria-checked="true"] .track { background: #16a34a; }
  #toggle[aria-checked="true"] .track::after { transform: translateX(20px); }
  #toggle:focus-visible { outline: 3px solid #f6c400; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" role="img" aria-label="Live side view of a paddle-wheel aerator oxygenating a fish pond"></canvas>
  <div id="do" class="hud"><i></i><span>Dissolved O₂ <b id="doVal">8.0</b> mg/L</span></div>
  <button id="toggle" class="hud" role="switch" aria-checked="true"><span class="track"></span><span id="tLabel">Aerator ON</span></button>
</div>
<script>
const PI = Math.PI, rnd = Math.random;
const stage = document.getElementById('stage'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ratio = new URLSearchParams(location.search).get('ratio');
if (ratio === '16:9' || ratio === '9:16') stage.dataset.ratio = ratio;

// ---------- state ----------
const SPIN_MAX = 5.2;                 // wheel speed, rad/s
let on = true, spin = SPIN_MAX, s01 = 1, wheelAngle = 0, O = 1, t = 0, flow = 0;
let W, H, k, L, skyGrad, waterGrad, far, earth, fgC, fg, clouds, grass, plants, fish;
const ripples = [];
let seed = 1;
const srnd = () => (seed = seed * 16807 % 2147483647) / 2147483647; // seeded, so resizes keep the same scenery

// ---------- layout (design units: 1600x900 landscape, 900x1600 portrait) ----------
function layer(draw) {
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); draw(g); return c;
}
const innerLeft = y => L.x1 + (L.x2 - L.x1) * (y - L.bankTop) / (L.bottom - L.bankTop);
const innerRight = y => W - innerLeft(y);

function layout() {
  const w = stage.clientWidth, h = stage.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (!w || !h) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const land = w >= h;
  W = land ? 1600 : 900; H = land ? 900 : 1600; k = cv.width / W;
  const water = land ? 400 : 600, bank = land ? 200 : 100;
  L = { land, water, bankTop: water - 30, bottom: H - (land ? 70 : 110), x1: bank * .5, x2: bank * 1.5,
        ax: land ? 800 : 450, sunX: land ? 1330 : 690, sunY: land ? 120 : 160 };
  seed = 7;

  skyGrad = ctx.createLinearGradient(0, 0, 0, water);
  skyGrad.addColorStop(0, '#4ba3e3'); skyGrad.addColorStop(.75, '#87CEEB'); skyGrad.addColorStop(1, '#c4eaf6');
  waterGrad = ctx.createLinearGradient(0, water - 10, 0, L.bottom);
  waterGrad.addColorStop(0, '#58c7d6'); waterGrad.addColorStop(.3, '#2aa3bf'); waterGrad.addColorStop(1, '#0e6a8f');

  far = layer(g => { // distant tree line + far shore
    for (let x = -20; x < W + 40; x += 22 + srnd() * 26) {
      const r = 20 + srnd() * 30;
      g.fillStyle = srnd() < .5 ? '#6f9f7a' : '#5f9070';
      g.beginPath(); g.arc(x, water - 44 - r * .6, r, 0, PI * 2); g.fill();
    }
    g.fillStyle = '#6aa548'; g.beginPath(); g.moveTo(0, water + 10);
    for (let x = 0; x <= W; x += 40) g.lineTo(x, water - 34 - 6 * Math.sin(x * .01));
    g.lineTo(W, water + 10); g.fill();
    g.fillStyle = '#8a6c47'; g.fillRect(0, water - 12, W, 22);
  });

  earth = layer(g => { // near banks + pond bottom, cut in cross-section
    const { x1, x2, bankTop: bt, bottom: b } = L;
    const eg = g.createLinearGradient(0, bt, 0, H);
    eg.addColorStop(0, '#8a6a43'); eg.addColorStop(1, '#5b4229');
    g.fillStyle = eg; g.beginPath();
    g.moveTo(0, bt); g.lineTo(x1, bt); g.lineTo(x2, b); g.lineTo(W - x2, b); g.lineTo(W - x1, bt); g.lineTo(W, bt); g.lineTo(W, H); g.lineTo(0, H); g.fill();
    g.strokeStyle = '#6b5133'; g.lineWidth = 6; // wet slope edge
    g.beginPath(); g.moveTo(x1, bt); g.lineTo(x2, b); g.lineTo(W - x2, b); g.lineTo(W - x1, bt); g.stroke();
    g.fillStyle = '#c9b083'; g.fillRect(x2, b, W - 2 * x2, 12); // sandy bottom
    for (let i = 0; i < 60; i++) { // pebbles
      g.fillStyle = srnd() < .5 ? '#9c8a6e' : '#7d6b52';
      g.beginPath(); g.ellipse(x2 + srnd() * (W - 2 * x2), b + 4 + srnd() * 10, 4 + srnd() * 7, 3 + srnd() * 4, 0, 0, PI * 2); g.fill();
    }
    g.fillStyle = '#5d9a35'; g.fillRect(0, bt - 8, x1 + 4, 12); g.fillRect(W - x1 - 4, bt - 8, x1 + 4, 12);
  });

  fgC = layer(() => {}); fg = fgC.getContext('2d');

  const cloudCount = land ? 7 : 6;
  clouds = Array.from({ length: cloudCount }, () => {
    const cw = 160 + srnd() * 220;
    return { x: srnd() * W, y: 20 + srnd() * water * .42, w: cw, speed: 40 + cw * .35, a: .75 + srnd() * .25, sprite: cloudSprite(cw) };
  });

  grass = [];
  for (const [a, b] of [[0, L.x1], [W - L.x1, W]]) for (let x = a; x < b; x += 3 + srnd() * 4)
    grass.push({ x, y: L.bankTop - 4, h: 14 + srnd() * 22, lean: (srnd() - .5) * 12, c: srnd() < .5 ? '#4f8f2f' : '#6aa83a' });

  plants = Array.from({ length: land ? 14 : 9 }, () => ({ x: L.x2 + 20 + srnd() * (W - 2 * L.x2 - 40), h: 60 + srnd() * 110, c: srnd() < .5 ? '#3f8f5a' : '#2f7a4c' }));

  fish = Array.from({ length: land ? 9 : 8 }, () => makeFish());
}

function cloudSprite(w) {
  const h = w * .55, c = document.createElement('canvas');
  c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
  const g = c.getContext('2d'); g.scale(k, k); g.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) {
    const u = i / 5, r = h * (.2 + srnd() * .14) * (1.25 - Math.abs(u - .5));
    g.beginPath(); g.arc(w * (.18 + .64 * u), h * .62 - r * .45, r, 0, PI * 2); g.fill();
  }
  g.beginPath(); g.ellipse(w * .5, h * .68, w * .4, h * .16, 0, 0, PI * 2); g.fill();
  g.globalCompositeOperation = 'source-atop'; // soft grey underside
  const sh = g.createLinearGradient(0, h * .3, 0, h * .85);
  sh.addColorStop(0, 'rgba(170,195,215,0)'); sh.addColorStop(1, 'rgba(170,195,215,.55)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  return { c, h };
}

// ---------- water surface ----------
function surf(x) {
  let y = L.water + 4 * Math.sin(x * .012 + t * 1.4) + 3 * Math.sin(x * .027 - t * 2.1);
  const d = Math.abs(x - L.ax);
  y += 6 * s01 * Math.sin(d * .045 - t * 7) * Math.exp(-d / 260); // ripples from the paddles
  for (const r of ripples) { // splash rings
    const age = t - r.t0; if (age > 3) continue;
    const q = Math.abs(x - r.x) - age * 140;
    y += r.a * Math.sin(q * .09) * Math.exp(-q * q / 900) * Math.exp(-age * 1.2);
  }
  return y;
}
function surfacePath(g, below) {
  g.beginPath(); g.moveTo(0, surf(0));
  for (let x = 16; x <= W + 16; x += 16) g.lineTo(x, surf(x));
  if (below) { g.lineTo(W, H); g.lineTo(0, H); } else { g.lineTo(W, 0); g.lineTo(0, 0); }
  g.closePath();
}

// ---------- particles: 0 drop, 1 mist, 2 foam, 3 bubble ----------
// ponytail: fixed ring buffer, oldest particle is overwritten; raise size if spray looks thin
const P = Array.from({ length: 1400 }, () => ({ life: 1, max: 0 }));
let ph = 0;
function emit(type, x, y, vx, vy, r, max) {
  const p = P[ph]; ph = (ph + 1) % P.length;
  p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.r = r; p.max = max; p.life = 0;
}
function splash(x, power) {
  ripples.push({ x, t0: t, a: 5 * power }); if (ripples.length > 4) ripples.shift();
  const y = surf(x);
  for (let i = 0; i < 18 * power; i++) emit(0, x + (rnd() - .5) * 16, y - 2, (rnd() - .5) * 260 * power, -(160 + rnd() * 260) * power, 1.5 + rnd() * 2.5, 3);
  for (let i = 0; i < 6; i++) emit(2, x + (rnd() - .5) * 40, y, (rnd() - .5) * 40, 0, 3 + rnd() * 4, 1 + rnd());
}

// ---------- aerator (side view, looking along the shaft) ----------
const R = 118, WC = { x: -40, y: -66 }; // wheel radius, wheel centre relative to waterline point
function aeratorPose() {
  const vib = .8 * s01 * Math.sin(t * 40);
  return { x: L.ax, y: surf(L.ax) + vib, tilt: Math.atan((surf(L.ax + 150) - surf(L.ax - 150)) / 300) * .8 };
}
function drawWheel(g, cx, cy, r, back) {
  const col = back ? '#c99f12' : '#f6c400', holes = back ? 'rgba(60,40,0,.35)' : 'rgba(90,60,0,.3)';
  g.save(); g.translate(cx, cy); g.rotate(wheelAngle + (back ? PI / 8 : 0));
  g.strokeStyle = col; g.lineWidth = 7; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * PI / 4; g.moveTo(0, 0); g.lineTo(Math.cos(a) * r * .62, Math.sin(a) * r * .62); }
  g.stroke();
  g.lineWidth = 8; g.beginPath(); g.arc(0, 0, r * .6, 0, PI * 2); g.stroke();
  for (let i = 0; i < 8; i++) { // perforated paddle plates
    g.save(); g.rotate(i * PI / 4);
    g.fillStyle = col; g.beginPath(); g.roundRect(r * .56, -r * .15, r * .46, r * .3, 4); g.fill();
    g.fillStyle = holes; g.beginPath();
    for (let a = 0; a < 3; a++) for (let b = 0; b < 2; b++) { g.moveTo(r * (.67 + a * .13) + r * .035, r * (-.07 + b * .14)); g.arc(r * (.67 + a * .13), r * (-.07 + b * .14), r * .035, 0, PI * 2); }
    g.fill(); g.restore();
  }
  g.fillStyle = back ? '#9c7c0c' : '#d9a900'; g.beginPath(); g.arc(0, 0, r * .14, 0, PI * 2); g.fill();
  g.fillStyle = '#c0c4c8'; g.beginPath(); g.arc(0, 0, r * .06, 0, PI * 2); g.fill();
  g.restore();
}
function drawAerator(g, pose) {
  g.save(); g.translate(pose.x, pose.y); g.rotate(pose.tilt);
  drawWheel(g, WC.x + 24, WC.y - 12, R * .96, true); // second wheel further along the shaft
  const hg = g.createLinearGradient(30, 0, 120, 0); hg.addColorStop(0, '#2a3d9e'); hg.addColorStop(1, '#17246b');
  g.fillStyle = hg; g.beginPath(); g.roundRect(30, -190, 92, 165, [44, 44, 8, 8]); g.fill(); // motor / gearbox housing
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 3; g.beginPath();
  for (let i = 0; i < 3; i++) { g.moveTo(44, -120 + i * 14); g.quadraticCurveTo(76, -130 + i * 14, 108, -120 + i * 14); }
  g.stroke();
  const fl = g.createLinearGradient(0, -26, 0, 44); fl.addColorStop(0, '#3346a8'); fl.addColorStop(1, '#16226a');
  g.fillStyle = fl; g.beginPath(); g.roundRect(-210, -26, 420, 70, 35); g.fill(); // HDPE float
  g.fillStyle = 'rgba(255,255,255,.15)'; g.beginPath(); g.roundRect(-190, -22, 380, 8, 4); g.fill();
  g.fillStyle = '#b8c0c8'; g.fillRect(-190, -38, 380, 9); // steel frame
  for (const x of [-160, 152]) g.fillRect(x, -38, 8, 14);
  g.fillStyle = '#22348f'; g.beginPath(); g.roundRect(WC.x - 15, WC.y + 8, 30, -38 - WC.y - 8, 4); g.fill(); // bearing block
  drawWheel(g, WC.x, WC.y, R, false);
  g.restore();
}

// ---------- fish ----------
const PALETTE = [
  { top: '#5d7380', mid: '#a9bcc6', belly: '#e8eef0', fin: '#8a9fa8' },
  { top: '#7a6a3a', mid: '#c9a75e', belly: '#efe2bd', fin: '#b8904a' },
  { top: '#a8452c', mid: '#e07a52', belly: '#f6d0b8', fin: '#d0643e' },
  { top: '#3f5f4a', mid: '#7f9f78', belly: '#dfe8d0', fin: '#6f8f68' },
];
function randomDepth() { return L.water + 90 + rnd() * (L.bottom - L.water - 170); }
function makeFish() {
  const y = randomDepth();
  return { x: innerLeft(y) + 60 + rnd() * (innerRight(y) - innerLeft(y) - 120), y, ty: y, dir: rnd() < .5 ? -1 : 1,
           speed: 50 + rnd() * 50, size: 24 + rnd() * 22, phase: rnd() * 6, tilt: 0, leap: null, above: false, ...PALETTE[rnd() * 4 | 0] };
}
function drawFish(g, f) {
  const s = f.size, wag = Math.sin(f.phase) * (.2 + .25 * O);
  g.save(); g.translate(f.x, f.y); g.scale(f.dir, 1); g.rotate(f.tilt);
  g.fillStyle = f.fin;
  g.save(); g.translate(-s * .78, 0); g.rotate(wag); // tail
  g.beginPath(); g.moveTo(s * .06, 0); g.quadraticCurveTo(-s * .3, -s * .15, -s * .55, -s * .42);
  g.quadraticCurveTo(-s * .4, 0, -s * .55, s * .42); g.quadraticCurveTo(-s * .3, s * .15, s * .06, 0); g.fill();
  g.restore();
  g.beginPath(); g.moveTo(s * .25, -s * .36); g.quadraticCurveTo(-s * .05, -s * .64, -s * .38, -s * .3); g.fill(); // dorsal
  g.beginPath(); g.moveTo(s * .12, s * .3); g.quadraticCurveTo(-s * .02, s * .52, -s * .2, s * .32); g.fill(); // pelvic
  const gr = g.createLinearGradient(0, -s * .45, 0, s * .45);
  gr.addColorStop(0, f.top); gr.addColorStop(.55, f.mid); gr.addColorStop(1, f.belly);
  g.fillStyle = gr; g.beginPath(); g.moveTo(s, 0);
  g.bezierCurveTo(s * .7, -s * .5, -s * .45, -s * .48, -s * .85, 0); g.bezierCurveTo(-s * .45, s * .44, s * .7, s * .48, s, 0); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = s * .04; g.beginPath(); g.arc(s * .45, 0, s * .26, -1, 1); g.stroke(); // gill
  g.fillStyle = '#fff'; g.beginPath(); g.arc(s * .68, -s * .08, s * .085, 0, PI * 2); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.arc(s * .7, -s * .08, s * .05, 0, PI * 2); g.fill();
  if (f.gasp) { g.fillStyle = 'rgba(70,20,20,.65)'; g.beginPath(); g.arc(s * .96, -s * .02, s * (.03 + .03 * Math.abs(Math.sin(t * 9 + f.phase))), 0, PI * 2); g.fill(); }
  g.restore();
}
function updateFish(f, dt) {
  if (f.leap) { // parabola out of the water and back
    const l = f.leap; l.u = Math.min(l.u + dt / l.T, 1);
    const u = l.u, ye = L.water + 50, A = (l.y0 + ye) / 2 - L.water + l.h;
    f.x = l.x0 + l.dx * u; f.y = l.y0 * (1 - u) + ye * u - A * 4 * u * (1 - u);
    f.tilt = Math.atan2(ye - l.y0 - A * 4 * (1 - 2 * u), Math.abs(l.dx));
    const above = f.y < surf(f.x);
    if (above !== f.above) splash(f.x, above ? .6 : 1);
    f.above = above; f.phase += dt * 14;
    if (u >= 1) { f.leap = null; f.ty = ye + 40; }
    return;
  }
  const low = O < .35;
  f.gasp = low && f.y < surf(f.x) + f.size + 25;
  f.phase += dt * (3 + 9 * O);
  const sp = f.speed * (.2 + .8 * O);
  f.x += f.dir * sp * dt;
  if (rnd() < dt * .25) f.ty = randomDepth();
  if (!low && Math.abs(f.x - L.ax) < 240) f.ty = Math.max(f.ty, L.water + 120); // stay under the paddles
  const target = low ? surf(f.x) + f.size * .3 + 6 : f.ty; // low oxygen: fish crowd the surface
  const dy = (target - f.y) * Math.min(1, dt * (low ? 1.2 : .6));
  f.y += dy;
  f.tilt = Math.max(-.4, Math.min(.4, Math.atan2(dy / dt, sp + 1) * .7));
  const xl = innerLeft(f.y) + f.size * 1.3, xr = innerRight(f.y) - f.size * 1.3;
  if (f.x < xl) { f.x = xl; f.dir = 1; }
  if (f.x > xr) { f.x = xr; f.dir = -1; }
  if (rnd() < dt * .08) f.dir *= -1;
  if (low && f.gasp && rnd() < dt * .6) ripples.push({ x: f.x + f.dir * f.size, t0: t, a: 1.5 }), ripples.length > 4 && ripples.shift();
  // healthy, oxygenated fish jump now and then
  if (O > .8 && f.y < L.water + 220 && Math.abs(f.x - L.ax) > 330 && rnd() < dt * .06 && !fish.some(o => o.leap)) {
    let dx = f.dir * (150 + rnd() * 90);
    if (f.x + dx > innerRight(L.water) - 80 || f.x + dx < innerLeft(L.water) + 80) { dx = -dx; f.dir = -f.dir; }
    f.leap = { u: 0, T: .9 + rnd() * .3, x0: f.x, y0: f.y, dx, h: 90 + rnd() * 70 };
  }
}

// ---------- update ----------
const acc = [0, 0, 0, 0, 0];
function update(dt) {
  t += dt;
  spin += ((on ? SPIN_MAX : 0) - spin) * Math.min(1, dt * (on ? 1.1 : .6)); // motor inertia
  s01 = spin / SPIN_MAX;
  wheelAngle -= spin * dt; // counter-clockwise: bottom pushes water to the right
  flow += dt * 120 * s01;
  O += on ? (1 - O) * .3 * s01 * dt : -(O - .15) * .1 * dt; // oxygen builds up / drains away
  for (const c of clouds) { c.x += c.speed * dt; if (c.x > W) { c.x = -c.w; c.y = 20 + rnd() * L.water * .42; } }

  const pose = aeratorPose(), cs = Math.cos(pose.tilt), sn = Math.sin(pose.tilt);
  const wx = pose.x + WC.x * cs - WC.y * sn, wy = pose.y + WC.x * sn + WC.y * cs;
  const exitX = wx + Math.sqrt(Math.max(R * R - (L.water - wy) ** 2, 0)); // where blades leave the water
  const RATE = [260, 70, 34, 30, 70];
  for (let i = 0; i < 5; i++) {
    acc[i] += RATE[i] * s01 * dt;
    for (; acc[i] >= 1; acc[i]--) {
      if (i === 0) { const x = exitX + (rnd() - .5) * 40; emit(0, x, surf(x) - 4, (120 + rnd() * 240) * s01, -(260 + rnd() * 300) * Math.sqrt(s01), 2 + rnd() * 3, 3); }
      else if (i === 1) { // water flung off rising blade tips
        const a = -.55 + rnd() * .65, v = R * spin * .6;
        emit(0, wx + R * Math.cos(a), wy + R * Math.sin(a), v * Math.sin(a) + 60, -v * Math.cos(a), 2 + rnd() * 2.5, 3);
      }
      else if (i === 2) emit(1, exitX + rnd() * 60, surf(exitX) - 10 - rnd() * 30, 40 + rnd() * 80, -30 - rnd() * 50, 10 + rnd() * 14, 2);
      else if (i === 3) { const x = exitX + rnd() * 80; emit(2, x, surf(x), (60 + rnd() * 60) * s01, 0, 4 + rnd() * 6, 2.5 + rnd() * 2); }
      else emit(3, wx - R * .7 + rnd() * R * 1.8, L.water + 15 + rnd() * 80, 40 + rnd() * 70, -20 - rnd() * 30, 2 + rnd() * 4, 6); // oxygen bubbles
    }
  }
  for (const p of P) {
    if (p.life >= p.max) continue;
    p.life += dt;
    if (p.type === 0) {
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vy > 0 && p.y > surf(p.x)) { p.type = 2; p.vx = p.vx * .3 + 30; p.vy = 0; p.r = 2 + rnd() * 3; p.life = 0; p.max = 1 + rnd() * 1.2; }
    } else if (p.type === 1) {
      p.vx *= 1 - dt * .8; p.vy *= 1 - dt * .8; p.x += p.vx * dt; p.y += p.vy * dt; p.r += 10 * dt;
    } else if (p.type === 2) {
      p.vx += (50 * s01 + 10 - p.vx) * dt * .5; p.x += p.vx * dt; p.y = surf(p.x) - 1;
    } else {
      p.vy = Math.max(p.vy - 40 * dt, -110); p.x += (p.vx + Math.sin(p.life * 7 + p.r) * 25) * dt; p.y += p.vy * dt;
      if (p.y < surf(p.x) + 3) p.life = p.max;
    }
  }
  for (const f of fish) updateFish(f, dt);
}

// ---------- draw ----------
function draw() {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, L.water + 20);

  const { sunX: sx, sunY: sy } = L; // sun: glow, slow rays, disc
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 260);
  glow.addColorStop(0, 'rgba(255,248,220,.95)'); glow.addColorStop(.2, 'rgba(255,236,170,.7)');
  glow.addColorStop(.45, 'rgba(255,220,140,.16)'); glow.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = glow; ctx.fillRect(sx - 260, sy - 260, 520, 520);
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * .06); ctx.fillStyle = 'rgba(255,240,190,.13)';
  for (let i = 0; i < 12; i++) {
    const len = 150 + 22 * Math.sin(t * 1.5 + i);
    ctx.rotate(PI / 6); ctx.beginPath(); ctx.moveTo(-9, -62); ctx.lineTo(0, -len); ctx.lineTo(9, -62); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#fff4c8'; ctx.beginPath(); ctx.arc(sx, sy, 52, 0, PI * 2); ctx.fill();

  for (const c of clouds) { ctx.globalAlpha = c.a; ctx.drawImage(c.sprite.c, c.x, c.y, c.w, c.sprite.h); }
  ctx.globalAlpha = 1;
  ctx.drawImage(far, 0, 0, W, H);

  surfacePath(ctx, true); ctx.fillStyle = waterGrad; ctx.fill();

  ctx.save(); surfacePath(ctx, true); ctx.clip(); // ---- underwater
  for (let i = 0; i < 6; i++) { // light shafts
    const x0 = L.sunX - 700 + i * 190 + 40 * Math.sin(t * .4 + i), w = 50 + 20 * Math.sin(t * .7 + i * 2);
    ctx.fillStyle = `rgba(255,255,255,${.045 + .03 * Math.sin(t * 1.1 + i * 1.9)})`;
    ctx.beginPath(); ctx.moveTo(x0, L.water - 10); ctx.lineTo(x0 + w, L.water - 10); ctx.lineTo(x0 + w - 260, L.bottom); ctx.lineTo(x0 - 330, L.bottom); ctx.fill();
  }
  ctx.lineCap = 'round'; ctx.lineWidth = 6;
  for (const p of plants) {
    const sway = Math.sin(t * 1.3 + p.x * .02) * 14;
    ctx.strokeStyle = p.c; ctx.beginPath(); ctx.moveTo(p.x, L.bottom + 4);
    ctx.quadraticCurveTo(p.x - sway * .5, L.bottom - p.h * .5, p.x + sway, L.bottom - p.h); ctx.stroke();
  }
  if (s01 > .02) { // oxygen-rich current: surface flows away from the paddles, deep water returns
    ctx.lineWidth = 3; ctx.setLineDash([22, 30]);
    const depth = L.bottom - L.water;
    [[70, 1], [115, 1], [160, 1], [depth - 110, -1], [depth - 60, -1]].forEach(([dy, dir], i) => {
      const y0 = L.water + dy, xa = innerLeft(y0) + 30, xb = innerRight(y0) - 30, start = dir > 0 ? Math.max(xa, L.ax - 120) : xa;
      ctx.lineDashOffset = -flow * dir;
      ctx.strokeStyle = `rgba(255,255,255,${(dir > 0 ? .3 : .16) * s01})`;
      ctx.beginPath();
      for (let x = start; x <= xb; x += 18) ctx.lineTo(x, y0 + 7 * Math.sin(x * .012 + i * 1.3 + t * .9));
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (const p of P) if (p.type === 3 && p.life < p.max) { ctx.moveTo(p.x + p.r, p.y); ctx.arc(p.x, p.y, p.r, 0, PI * 2); }
  ctx.stroke();
  for (const f of fish) if (!f.leap) drawFish(ctx, f);
  ctx.restore();

  // aerator + leaping fish on their own layer, then tint whatever sits below the surface
  fg.setTransform(1, 0, 0, 1, 0, 0); fg.clearRect(0, 0, fgC.width, fgC.height); fg.setTransform(k, 0, 0, k, 0, 0);
  drawAerator(fg, aeratorPose());
  for (const f of fish) if (f.leap) drawFish(fg, f);
  fg.globalCompositeOperation = 'source-atop'; surfacePath(fg, true); fg.fillStyle = 'rgba(40,150,180,.55)'; fg.fill();
  fg.globalCompositeOperation = 'source-over';
  ctx.drawImage(fgC, 0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; ctx.beginPath(); // surface sheen
  for (let x = 0; x <= W + 16; x += 16) ctx.lineTo(x, surf(x));
  ctx.stroke();
  for (let i = 0; i < 14; i++) { // sun glitter
    const a = Math.sin(t * 6 + i * 1.7); if (a <= 0) continue;
    const x = L.sunX + Math.sin(i * 12.9898) * 160, len = 10 + (i % 4) * 5;
    ctx.fillStyle = `rgba(255,252,235,${a * .9})`; ctx.fillRect(x, surf(x) + 2 + (i % 3) * 5, len, 2);
  }

  ctx.drawImage(earth, 0, 0, W, H);
  ctx.lineWidth = 2.4;
  for (const g of grass) {
    const sway = Math.sin(t * 2 + g.x * .05) * 4;
    ctx.strokeStyle = g.c; ctx.beginPath(); ctx.moveTo(g.x, g.y);
    ctx.quadraticCurveTo(g.x + g.lean * .5, g.y - g.h * .6, g.x + g.lean + sway, g.y - g.h); ctx.stroke();
  }

  for (const p of P) { // spray, mist, foam
    if (p.life >= p.max || p.type === 3) continue;
    const u = p.life / p.max;
    ctx.globalAlpha = p.type === 0 ? .9 : p.type === 1 ? .22 * Math.sin(PI * u) : .8 * (1 - u);
    ctx.fillStyle = p.type === 0 ? '#f4fbff' : '#fff';
    ctx.beginPath();
    if (p.type === 2) ctx.ellipse(p.x, p.y, p.r, p.r * .45, 0, 0, PI * 2); else ctx.arc(p.x, p.y, p.r, 0, PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- UI / loop ----------
const toggle = document.getElementById('toggle'), tLabel = document.getElementById('tLabel');
const doVal = document.getElementById('doVal'), doBox = document.getElementById('do');
toggle.onclick = () => {
  on = !on;
  toggle.setAttribute('aria-checked', on);
  tLabel.textContent = `Aerator ${on ? 'ON' : 'OFF'}`;
};
let hudT = 0;
function hud(dt) { // throttled, so the text isn't rewritten every frame
  if ((hudT += dt) < .25) return; hudT = 0;
  const mg = 2 + O * 6;
  doVal.textContent = mg.toFixed(1);
  doBox.style.setProperty('--c', mg > 5 ? '#16a34a' : mg > 3.8 ? '#f59e0b' : '#dc2626');
}

let last = 0, visible = true, raf = 0;
function frame(now) {
  const dt = Math.min((now - (last || now)) / 1000, .05); last = now;
  update(dt); draw(); hud(dt);
  raf = visible ? requestAnimationFrame(frame) : 0;
}
new ResizeObserver(() => { layout(); if (W && !raf) raf = requestAnimationFrame(frame); }).observe(stage);
new IntersectionObserver(([e]) => { // pause when scrolled off the landing page
  visible = e.isIntersecting;
  if (visible && !raf && W) { last = 0; raf = requestAnimationFrame(frame); }
}).observe(stage);
</script>
</body>
</html>
